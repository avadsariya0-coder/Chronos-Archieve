<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>chronos_v0.4_test</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: monospace;
            overflow: hidden;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    1000
);

camera.position.set(0, 8, 32);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const canvas = document.createElement("canvas");
canvas.width = canvas.height = 256;

const ctx = canvas.getContext("2d");

ctx.fillStyle = "#181818";
ctx.fillRect(0, 0, 256, 256);

ctx.strokeStyle = "#444444";
ctx.lineWidth = 2;

for (let x = 0; x <= 256; x += 32) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 256);
    ctx.stroke();
}

for (let y = 0; y <= 256; y += 32) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(256, y);
    ctx.stroke();
}

const gridTexture = new THREE.CanvasTexture(canvas);

gridTexture.wrapS = gridTexture.wrapT = THREE.RepeatWrapping;
gridTexture.repeat.set(3, 6);

scene.add(new THREE.AmbientLight(0x444444));

const orangeLight = new THREE.PointLight(
    0xff7700,
    150,
    100
);

orangeLight.position.set(0, 6, 5);
scene.add(orangeLight);

const blueLight = new THREE.PointLight(
    0x0066ff,
    80,
    80
);

blueLight.position.set(0, 15, 0);
scene.add(blueLight);

const tower = new THREE.Mesh(
    new THREE.BoxGeometry(4, 18, 4),
    new THREE.MeshStandardMaterial({
        map: gridTexture,
        color: 0x553322,
        metalness: 0.7,
        roughness: 0.4
    })
);

tower.position.y = 7;
scene.add(tower);

for (let i = 0; i < 12; i++) {

    const block = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.7, 0.7),
        new THREE.MeshStandardMaterial({
            color: 0xff7700,
            emissive: 0x552200
        })
    );

    block.position.set(
        (Math.random() - 0.5) * 3,
        i * 1.2 - 1,
        2.1
    );

    tower.add(block);
}

const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(2, 24, 24),
    new THREE.MeshStandardMaterial({
        color: 0x0088ff,
        emissive: 0x003366,
        metalness: 0.2,
        roughness: 0.2
    })
);

sphere.position.y = 18;
scene.add(sphere);

const rings = new THREE.Group();

for (let i = 0; i < 3; i++) {

    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(
            3 + i * 1.2,
            0.12,
            12,
            40
        ),
        new THREE.MeshStandardMaterial({
            color: 0xff8800,
            emissive: 0x442200,
            metalness: 0.7
        })
    );

    ring.rotation.set(
        Math.random() * 1.5,
        0,
        Math.random() * 1.5
    );

    rings.add(ring);
}

rings.position.y = 18;
scene.add(rings);

const cubes = new THREE.Group();

for (let i = 0; i < 80; i++) {

    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.6, 0.6),
        new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0x331100
        })
    );

    let angle = i * 0.35;
    let dist = 7 + Math.random() * 4;

    cube.position.set(
        Math.cos(angle) * dist,
        Math.random() * 18 - 3,
        Math.sin(angle) * dist
    );

    cube.rotation.set(
        Math.random(),
        Math.random(),
        0
    );

    cubes.add(cube);
}

scene.add(cubes);

const scythe = new THREE.Group();

scythe.add(
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.12,
            0.12,
            12,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x333333,
            metalness: 0.8
        })
    )
);

const blade = new THREE.Mesh(
    new THREE.TorusGeometry(
        3,
        0.18,
        8,
        20,
        Math.PI
    ),
    new THREE.MeshStandardMaterial({
        color: 0x00ccaa,
        emissive: 0x003322,
        metalness: 0.6
    })
);

blade.position.y = 5;
blade.rotation.z = 2;

scythe.add(blade);

scythe.position.set(-11, 4, 0);
scene.add(scythe);

const floorTexture = gridTexture.clone();
floorTexture.repeat.set(12, 12);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({
        map: floorTexture,
        color: 0x555555,
        roughness: 0.8
    })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -3;

scene.add(floor);

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    tower.rotation.y += 0.001;

    sphere.rotation.y += 0.01;

    rings.rotation.y += 0.005;
    rings.rotation.x += 0.002;

    cubes.rotation.y += 0.001;

    scythe.rotation.y =
        Math.sin(Date.now() * 0.001) * 0.3;

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {

    camera.aspect = innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});

</script>

</body>
</html>
