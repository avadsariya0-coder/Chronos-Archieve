<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>THE CHRONOS ARCHIVE</title>
<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
color:white;
}
#title{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:30px;
letter-spacing:5px;
z-index:100;
text-shadow: 0 0 10px rgba(255,170,0,0.5);
}
</style>
<script async src="https://unpkg.com/es-module-shims/dist/es-module-shims.js"></script>
<script type="importmap">
{
"imports": {
"three":"https://unpkg.com/three@0.171.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.171.0/examples/jsm/"
}
}
</script>
</head>
<body>

<div id="title">
THE CHRONOS ARCHIVE
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x050200,0.02);

const camera=new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);
camera.position.set(0,10,35);

const renderer=new THREE.WebGLRenderer({
antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.maxPolarAngle=Math.PI/2-0.05;

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),1.5,0.4,0.15);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x111122,0.4));
const pointLight=new THREE.PointLight(0xff7700,1000,100);
pointLight.position.set(0,2,0);
scene.add(pointLight);
const dirLight=new THREE.DirectionalLight(0xffbb88,1.5);
dirLight.position.set(5,20,5);
scene.add(dirLight);

function generateTexture(){
    const canvas=document.createElement("canvas");
    canvas.width=1024;
    canvas.height=1024;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#121216";
    ctx.fillRect(0,0,1024,1024);
    ctx.strokeStyle="rgba(255,120,0,0.08)";
    ctx.lineWidth=2;
    for(let i=0;i<1024;i+=32){
        ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,1024);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(1024,i);ctx.stroke();
    }
    ctx.fillStyle="#ffffff";
    for(let x=64;x<1024;x+=128){
        for(let y=64;y<1024;y+=64){
            if(Math.random()>0.4){
                ctx.save();
                ctx.globalAlpha=Math.random()*0.8+0.2;
                let w=Math.random()*40+5;
                ctx.fillRect(x+(Math.random()*20),y,w,4);
                if(Math.random()>0.7){
                    ctx.fillRect(x,y-10,6,6);
                }
                ctx.restore();
            }
        }
    }
    const tex=new THREE.CanvasTexture(canvas);
    tex.wrapS=THREE.RepeatWrapping;
    tex.wrapT=THREE.RepeatWrapping;
    return tex;
}
const techTexture=generateTexture();

const monolithGeo=new THREE.CylinderGeometry(1.5,3.5,22,4,1);
const monolithMat=new THREE.MeshStandardMaterial({
    map:techTexture,
    roughnessMap:techTexture,
    metalness:0.8,
    roughness:0.2,
    emissive:0xffaa33,
    emissiveMap:techTexture,
    emissiveIntensity:1.5
});
const monolith=new THREE.Mesh(monolithGeo, monolithMat);
monolith.position.y=8;
scene.add(monolith);

const eye=new THREE.Group();
const ringMat=new THREE.MeshStandardMaterial({
    color:0xffaa33,
    metalness:0.9,
    roughness:0.1
});
for(let i=0;i<3;i++){
    const ring=new THREE.Mesh(
        new THREE.TorusGeometry(4+i*1.2,0.15,16,100),
        ringMat
    );
    ring.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);
    eye.add(ring);
}
const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(1.8,32,32),
    new THREE.MeshPhysicalMaterial({
        color:0x00aaff,
        emissive:0x0066ff,
        emissiveIntensity:3,
        roughness:0.1,
        metalness:0.1,
        transmission:0.6,
        thickness:1.2
    })
);
eye.add(sphere);
eye.position.set(0,15,0);
scene.add(eye);

const scythe=new THREE.Group();
const handle=new THREE.Mesh(
    new THREE.CylinderGeometry(0.12,0.18,14,8),
    new THREE.MeshStandardMaterial({color:0x222226,metalness:0.7,roughness:0.3})
);
scythe.add(handle);
const blade=new THREE.Mesh(
    new THREE.TorusGeometry(3.5,0.3,8,24,Math.PI*0.7),
    new THREE.MeshStandardMaterial({
        color:0x00ffcc,
        emissive:0x00ffcc,
        emissiveIntensity:2.5,
        wireframe:true
    })
);
blade.position.set(-1.8,5.5,0);
blade.rotation.z=2.1;
scythe.add(blade);
scythe.position.set(-11,4,-2);
scene.add(scythe);

const cubes=new THREE.Group();
const cubeMat=new THREE.MeshStandardMaterial({
    color:0xff7700,
    emissive:0xff4400,
    emissiveIntensity:0.4,
    metalness:0.5,
    roughness:0.2
});
for(let i=0;i<240;i++){
    const cube=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8),cubeMat);
    let angle=i*0.14;
    let radius=6.5+(i*0.04);
    let yPos=(i*0.11)-4;
    cube.position.set(
        Math.cos(angle)*radius,
        yPos,
        Math.sin(angle)*radius
    );
    cube.rotation.set(Math.random(),Math.random(),0);
    cubes.add(cube);
}
scene.add(cubes);

const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({map:techTexture,roughness:0.4,metalness:0.2})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-3;
scene.add(floor);

function animate(){
    requestAnimationFrame(animate);
    const time=Date.now()*0.001;
    controls.update();
    scythe.rotation.y=Math.sin(time*0.5)*0.3;
    cubes.rotation.y+=0.001;
    eye.rotation.y+=0.003;
    eye.children.forEach((child,idx)=>{
        if(child.geometry.type==="TorusGeometry"){
            child.rotation.x+=0.005*(idx+1);
            child.rotation.y+=0.002*(idx+1);
        }
    });
    monolith.material.emissiveIntensity=1.2+Math.sin(time*2.5)*0.8;
    eye.position.y=15+Math.sin(time*1.5)*0.5;
    composer.render();
}
animate();

window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
    composer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
